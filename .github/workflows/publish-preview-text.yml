name: Publish Preview Text
on:
  push:
    branches: [main]
    paths: ['publish-preview/*.json']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: {group: preview-text-questions, cancel-in-progress: false}
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with: {fetch-depth: 2}
      - uses: peaceiris/actions-hugo@v3
        with: {hugo-version: '0.157.0', extended: true}
      - id: req
        run: |
          REQUEST=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep '^publish-preview/.*\.json$' | head -n1); test -n "$REQUEST"
          for key in canonical_url filename title date description audio_url; do value=$(jq -r --arg k "$key" '.[$k] // empty' "$REQUEST"); test -n "$value"; echo "$key<<EOF" >> "$GITHUB_OUTPUT"; echo "$value" >> "$GITHUB_OUTPUT"; echo EOF >> "$GITHUB_OUTPUT"; done
      - name: Generate exact canonical article
        env:
          URL: "${{ steps.req.outputs.canonical_url }}"
          FILE: "${{ steps.req.outputs.filename }}"
          TITLE: "${{ steps.req.outputs.title }}"
          DATE: "${{ steps.req.outputs.date }}"
          DESCRIPTION: "${{ steps.req.outputs.description }}"
          AUDIO: "${{ steps.req.outputs.audio_url }}"
        run: |
          mkdir -p content/posts
          curl --fail --retry 3 "$URL" -o /tmp/canonical.txt
          { printf '%s\n' '---'; printf 'title: "%s"\n' "$TITLE"; printf 'date: %s\n' "$DATE"; printf 'draft: false\n'; printf 'description: "%s"\n' "$DESCRIPTION"; printf '%s\n\n' '---'; printf '<audio controls preload="none"><source src="%s" type="audio/mpeg"></audio>\n\n备用播放链接：%s\n\n' "$AUDIO" "$AUDIO"; cat /tmp/canonical.txt; } > "content/posts/$FILE"
      - run: |
          hugo --minify --buildFuture
          test -f "public/posts/${{ steps.req.outputs.filename }}" || true
          grep -F "${{ steps.req.outputs.title }}" public/index.html
          grep -R -F "${{ steps.req.outputs.audio_url }}" public/posts/
      - uses: actions/upload-pages-artifact@v4
        with: {path: ./public}
      - name: Commit source
        run: |
          git config user.name github-actions[bot]; git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add content/posts; git diff --cached --quiet || git commit -m "Publish preview text: ${{ steps.req.outputs.title }} [skip ci]"; git push
      - name: Deploy Pages
        uses: actions/deploy-pages@v4
