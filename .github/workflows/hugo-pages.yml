name: Deploy Hugo site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: peaceiris/actions-hugo@v3
        with: {hugo-version: '0.157.0', extended: true}
      - run: hugo --minify --buildFuture
      - name: Verify generated site
        run: |
          test -f public/index.html
          COUNT=$(find public/posts -name index.html 2>/dev/null | wc -l); test "$COUNT" -ge 1
      - uses: actions/upload-pages-artifact@v4
        with: {path: ./public}
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
